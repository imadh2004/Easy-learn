<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard | Easy Learn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #333;
  padding: 20px;
}
.header {
  max-width: 900px;
  margin: 0 auto 20px auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}
.header h2 { color: #6b73ff; font-size: 1.5rem; }
.nav-btns { display: flex; gap: 10px; }
button {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  background: #6b73ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.3s;
}
button:hover { background: #000dff; }
.logout-btn { background: #dc3545; }
.logout-btn:hover { background: #bd2130; }

.container {
  max-width: 900px;
  margin: 0 auto;
}
.card {
  background: #fff;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  margin-bottom: 20px;
}
.card h3 { margin-bottom: 15px; color: #333; }

.exam-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: #f8f9fa;
  border-radius: 8px;
  margin-bottom: 10px;
  border-left: 5px solid #6b73ff;
}
.exam-item h4 { font-size: 1.1rem; margin-bottom: 4px; }
.exam-item p { font-size: 0.85rem; color: #666; }
.btn-start { background: #28a745; }
.btn-start:hover { background: #218838; }
.btn-disabled { background: #6c757d; cursor: not-allowed; }
.btn-disabled:hover { background: #6c757d; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h2 id="welcomeText">Welcome Student</h2>
    <p id="studentIndexText" style="color: #666; font-size: 0.9rem;"></p>
  </div>
  <div class="nav-btns">
    <button onclick="location.href='my-results.html'">📊 My Results</button>
    <button onclick="location.href='leaderboard.html'">🏆 Leaderboard</button>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>
</div>

<div class="container">
  <div class="card">
    <h3>Available Active Exams</h3>
    <div id="examsList">Loading active exams...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiC22wBDyBitvwXPfgABS4vu0uNMgmZ5c",
  authDomain: "new-science-5fb45.firebaseapp.com",
  projectId: "new-science-5fb45",
  storageBucket: "new-science-5fb45.firebasestorage.app",
  messagingSenderId: "76803175944",
  appId: "1:76803175944:web:565258c4210a1ac85003bd",
  measurementId: "G-9B5QKQF9DY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let studentData = null;

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const stuDoc = await getDoc(doc(db, "students", user.uid));
    if (stuDoc.exists()) {
      studentData = stuDoc.data();
      document.getElementById("welcomeText").textContent = `Welcome, ${studentData.name}`;
      document.getElementById("studentIndexText").textContent = `Index: ${studentData.index}`;
      loadActiveExams();
    } else {
      alert("Student profile not found.");
      signOut(auth);
    }
  } else {
    location.href = "index.html";
  }
});

async function loadActiveExams() {
  const container = document.getElementById("examsList");
  container.innerHTML = "";

  const snap = await getDocs(collection(db, "exams"));
  const activeExams = [];
  
  snap.forEach(docSnap => {
    const data = docSnap.data();
    if (data.active) {
      activeExams.push({ id: docSnap.id, ...data });
    }
  });

  if (activeExams.length === 0) {
    container.innerHTML = "<p style='color: #777;'>No active exams currently available.</p>";
    return;
  }

  const attempts = studentData.attempts || {};

  activeExams.forEach(exam => {
    const hasAttempted = attempts[exam.id] !== undefined;
    
    const div = document.createElement("div");
    div.className = "exam-item";
    
    div.innerHTML = `
      <div>
        <h4>${exam.title}</h4>
        <p>⏱ Duration: ${exam.duration} Minutes | ❓ Questions: ${exam.questions ? exam.questions.length : 0}</p>
      </div>
      <div>
        ${
          hasAttempted 
          ? `<button class="btn-disabled" disabled>Completed</button>`
          : `<button class="btn-start" onclick="startExam('${exam.id}')">Start Exam</button>`
        }
      </div>
    `;
    
    container.appendChild(div);
  });
}

window.startExam = (examId) => {
  localStorage.setItem("currentExamId", examId);
  location.href = "student-exams.html";
};

document.getElementById("logoutBtn").onclick = () => {
  signOut(auth).then(() => location.href = "index.html");
};
</script>
</body>
</html>
