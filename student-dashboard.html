<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
    color: #333;
    padding: 20px;
    margin: 0;
  }
  .header {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .header h2 {
    margin: 0;
    color: #007bff;
  }
  .btn {
    padding: 10px 15px;
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-left: 5px;
  }
  .btn:hover {
    background-color: #0056b3;
  }
  .btn-logout {
    background-color: #dc3545;
  }
  .btn-logout:hover {
    background-color: #c82333;
  }
  .exam-card {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .exam-title {
    font-size: 18px;
    font-weight: bold;
    color: #333;
  }
  .exam-info {
    font-size: 14px;
    color: #666;
    margin-top: 5px;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h2 id="studentWelcome">Welcome, Student</h2>
    <div id="studentIndexDisplay" style="color:#666; margin-top:4px;"></div>
  </div>
  <div>
    <button class="btn" onclick="goToMyResults()">My Results</button>
    <button class="btn" onclick="goToLeaderboard()">Leaderboard</button>
    <button class="btn btn-logout" id="logoutBtn">Logout</button>
  </div>
</div>

<h3>Active Exams</h3>
<div id="activeExamsList">Loading active exams...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiC22wBDyBitvwXPfgABS4vu0uNMgmZ5c",
  authDomain: "new-science-5fb45.firebaseapp.com",
  projectId: "new-science-5fb45",
  storageBucket: "new-science-5fb45.firebasestorage.app",
  messagingSenderId: "76803175944",
  appId: "1:76803175944:web:565258c4210a1ac85003bd",
  measurementId: "G-9B5QKQF9DY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentStudent = null;

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const stuDoc = await getDoc(doc(db, "students", user.uid));
    if (stuDoc.exists()) {
      currentStudent = stuDoc.data();
      document.getElementById("studentWelcome").textContent = `Welcome, ${currentStudent.name}`;
      document.getElementById("studentIndexDisplay").textContent = `Index: ${currentStudent.index}`;
      loadActiveExams();
    } else {
      alert("Student record not found.");
      signOut(auth);
    }
  } else {
    location.href = "index.html";
  }
});

async function loadActiveExams() {
  const container = document.getElementById("activeExamsList");
  container.innerHTML = "";

  const snap = await getDocs(collection(db, "exams"));
  const activeExams = [];

  snap.forEach((d) => {
    const data = d.data();
    if (data.active) {
      activeExams.push({ id: d.id, ...data });
    }
  });

  if (activeExams.length === 0) {
    container.innerHTML = "<p>No active exams available at the moment.</p>";
    return;
  }

  const attempts = currentStudent.attempts || {};

  activeExams.forEach((exam) => {
    const card = document.createElement("div");
    card.className = "exam-card";

    const hasAttempted = attempts[exam.id] !== undefined;

    card.innerHTML = `
      <div>
        <div class="exam-title">${exam.title}</div>
        <div class="exam-info">Duration: ${exam.duration} mins | Questions: ${exam.questions ? exam.questions.length : 0}</div>
      </div>
      <div>
        ${
          hasAttempted
            ? `<button class="btn" style="background-color:#6c757d; cursor:not-allowed;" disabled>Attempted</button>`
            : `<button class="btn" onclick="startExam('${exam.id}')">Start Exam</button>`
        }
      </div>
    `;

    container.appendChild(card);
  });
}

window.startExam = (examId) => {
  localStorage.setItem("currentExamId", examId);
  location.href = "student-exams.html";
};

window.goToMyResults = () => {
  location.href = "my-results.html";
};

window.goToLeaderboard = () => {
  location.href = "leaderboard.html";
};

document.getElementById("logoutBtn").onclick = () => {
  signOut(auth).then(() => {
    location.href = "index.html";
  });
};
</script>
</body>
</html>
