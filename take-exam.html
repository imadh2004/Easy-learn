<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Take Exam | Easy Learn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #6b73ff, #000dff);
    min-height: 100vh;
    padding: 20px;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    width: 95%;
    max-width: 800px;
    background: #fff;
    color: #333;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #eee;
    padding-bottom: 15px;
    margin-bottom: 25px;
  }
  .header h2 { color: #000dff; font-size: 1.5rem; }
  .timer {
    font-size: 1.2rem;
    font-weight: bold;
    background: #ff4d4d;
    color: white;
    padding: 6px 15px;
    border-radius: 20px;
  }
  .question-block {
    margin-bottom: 25px;
  }
  .question-title {
    font-size: 1.1rem;
    font-weight: bold;
    margin-bottom: 15px;
  }
  .option {
    display: block;
    background: #f8f9fa;
    border: 1px solid #ddd;
    padding: 12px 15px;
    border-radius: 8px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .option:hover { background: #e9ecef; }
  .option input { margin-right: 10px; }
  .btn-submit {
    width: 100%;
    padding: 12px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
    transition: background 0.3s;
  }
  .btn-submit:hover { background: #218838; }
</style>
</head>
<body>

<div class="container" id="examBox">
  <div class="header">
    <h2 id="examTitle">Loading Exam...</h2>
    <div class="timer" id="timer">--:--</div>
  </div>

  <form id="examForm">
    <div id="questionsContainer"></div>
    <button type="submit" class="btn-submit" id="submitBtn">Submit Exam</button>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiC22wBDyBitvwXPfgABS4vu0uNMgmZ5c",
  authDomain: "new-science-5fb45.firebaseapp.com",
  projectId: "new-science-5fb45",
  storageBucket: "new-science-5fb45.firebasestorage.app",
  messagingSenderId: "76803175944",
  appId: "1:76803175944:web:565258c4210a1ac85003bd",
  measurementId: "G-9B5QKQF9DY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const examId = localStorage.getItem("currentExamId");
let currentStudent = null;
let examData = null;
let timerInterval = null;

if (!examId) {
  alert("No exam selected.");
  location.href = "student-exams.html";
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const stuDoc = await getDoc(doc(db, "students", user.uid));
    if (stuDoc.exists()) {
      currentStudent = { uid: user.uid, ...stuDoc.data() };
      
      if (currentStudent.attempts && currentStudent.attempts[examId] !== undefined) {
        alert("You have already completed this exam.");
        location.href = "student-exams.html";
        return;
      }
      
      loadExamDetails();
    } else {
      location.href = "index.html";
    }
  } else {
    location.href = "index.html";
  }
});

async function loadExamDetails() {
  const examDoc = await getDoc(doc(db, "exams", examId));
  if (!examDoc.exists()) {
    alert("Exam not found.");
    location.href = "student-exams.html";
    return;
  }

  examData = examDoc.data();
  document.getElementById("examTitle").textContent = examData.title;

  renderQuestions(examData.questions || []);
  startTimer(parseInt(examData.duration) * 60);
}

function renderQuestions(questions) {
  const container = document.getElementById("questionsContainer");
  container.innerHTML = "";

  questions.forEach((q, index) => {
    const div = document.createElement("div");
    div.className = "question-block";

    let optionsHtml = "";
    q.options.forEach((opt, optIdx) => {
      optionsHtml += `
        <label class="option">
          <input type="radio" name="q_${index}" value="${optIdx}" required>
          ${opt}
        </label>
      `;
    });

    div.innerHTML = `
      <div class="question-title">Q${index + 1}: ${q.question}</div>
      ${optionsHtml}
    `;
    container.appendChild(div);
  });
}

function startTimer(durationSeconds) {
  let timer = durationSeconds;
  const timerElem = document.getElementById("timer");

  timerInterval = setInterval(() => {
    const minutes = Math.floor(timer / 60);
    const seconds = timer % 60;

    timerElem.textContent = `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;

    if (--timer < 0) {
      clearInterval(timerInterval);
      alert("Time is up! Submitting your exam automatically.");
      submitExam();
    }
  }, 1000);
}

document.getElementById("examForm").onsubmit = (e) => {
  e.preventDefault();
  if (confirm("Are you sure you want to submit your exam?")) {
    submitExam();
  }
};

async function submitExam() {
  clearInterval(timerInterval);
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").textContent = "Submitting...";

  const questions = examData.questions || [];
  let score = 0;

  questions.forEach((q, index) => {
    const selected = document.querySelector(`input[name="q_${index}"]:checked`);
    if (selected) {
      const selectedValue = Number(selected.value);
      
      // Supports 0-based index (0, 1, 2, 3) and 1-based index (1, 2, 3, 4) schema types
      let correctVal = q.correctIndex !== undefined ? Number(q.correctIndex) : Number(q.correct);
      
      if (selectedValue === correctVal) {
        score++;
      }
    }
  });

  const percentage = questions.length > 0 ? Math.round((score / questions.length) * 100) : 0;

  try {
    const studentRef = doc(db, "students", currentStudent.uid);
    await updateDoc(studentRef, {
      [`attempts.${examId}`]: {
        score: score,
        totalQuestions: questions.length,
        percentage: percentage,
        submittedAt: Date.now()
      }
    });

    alert(`Exam Submitted! Your score: ${score}/${questions.length} (${percentage}%)`);
    location.href = "my-results.html";
  } catch (err) {
    alert("Error saving exam result: " + err.message);
  }
}
</script>
</body>
</html>
