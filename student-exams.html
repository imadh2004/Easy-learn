<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Available Exams | Easy Learn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #6b73ff, #000dff);
    min-height: 100vh;
    padding: 30px 20px;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    width: 95%;
    max-width: 800px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }
  .header h1 {
    font-size: 2rem;
  }
  .btn-back {
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: 1px solid white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: bold;
    backdrop-filter: blur(5px);
    transition: background 0.3s;
  }
  .btn-back:hover {
    background: rgba(255, 255, 255, 0.4);
  }
  .exams-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .exam-card {
    background: white;
    color: #333;
    padding: 20px 25px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .exam-info h3 {
    font-size: 1.3rem;
    color: #000dff;
    margin-bottom: 6px;
  }
  .exam-info p {
    font-size: 0.9rem;
    color: #666;
  }
  .btn-start {
    padding: 10px 20px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
  }
  .btn-start:hover {
    background: #218838;
  }
  .btn-disabled {
    padding: 10px 20px;
    background: #6c757d;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: not-allowed;
  }
  .btn-inactive {
    padding: 10px 20px;
    background: #dc3545;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: not-allowed;
  }
  .loading-text {
    text-align: center;
    font-size: 1.2rem;
    opacity: 0.9;
    margin-top: 40px;
  }
  @media (max-width: 600px) {
    .exam-card {
      flex-direction: column;
      align-items: flex-start;
      gap: 15px;
    }
    .exam-card div:last-child {
      width: 100%;
    }
    .btn-start, .btn-disabled, .btn-inactive {
      width: 100%;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Available Exams</h1>
    <button class="btn-back" onclick="goToDashboard()">⬅ Dashboard</button>
  </div>

  <div id="examsContainer" class="exams-list">
    <div class="loading-text">Loading active exams...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiC22wBDyBitvwXPfgABS4vu0uNMgmZ5c",
  authDomain: "new-science-5fb45.firebaseapp.com",
  projectId: "new-science-5fb45",
  storageBucket: "new-science-5fb45.firebasestorage.app",
  messagingSenderId: "76803175944",
  appId: "1:76803175944:web:565258c4210a1ac85003bd",
  measurementId: "G-9B5QKQF9DY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentStudent = null;

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const stuDoc = await getDoc(doc(db, "students", user.uid));
    if (stuDoc.exists()) {
      currentStudent = stuDoc.data();
      loadExams();
    } else {
      alert("Student record not found.");
      location.href = "index.html";
    }
  } else {
    location.href = "index.html";
  }
});

async function loadExams() {
  const container = document.getElementById("examsContainer");
  container.innerHTML = "";

  const snap = await getDocs(collection(db, "exams"));
  const exams = [];

  snap.forEach((d) => {
    exams.push({ id: d.id, ...d.data() });
  });

  if (exams.length === 0) {
    container.innerHTML = "<div class='loading-text'>No exams available at the moment.</div>";
    return;
  }

  const attempts = currentStudent.attempts || {};

  exams.forEach((exam) => {
    const card = document.createElement("div");
    card.className = "exam-card";

    const hasAttempted = attempts[exam.id] !== undefined;

    let buttonHtml = "";
    if (hasAttempted) {
      buttonHtml = `<button class="btn-disabled" disabled>Completed</button>`;
    } else if (exam.active) {
      buttonHtml = `<button class="btn-start" onclick="startExam('${exam.id}')">Start Exam</button>`;
    } else {
      buttonHtml = `<button class="btn-inactive" disabled>Inactive</button>`;
    }

    card.innerHTML = `
      <div class="exam-info">
        <h3>${exam.title}</h3>
        <p>⏱ Duration: ${exam.duration} Minutes | ❓ Questions: ${exam.questions ? exam.questions.length : 0}</p>
      </div>
      <div>
        ${buttonHtml}
      </div>
    `;

    container.appendChild(card);
  });
}

window.startExam = (examId) => {
  localStorage.setItem("currentExamId", examId);
  location.href = "take-exam.html";
};

window.goToDashboard = () => {
  location.href = "student-dashboard.html";
};
</script>

</body>
</html>
