<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Results | Easy Learn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #6b73ff, #000dff);
    min-height: 100vh;
    padding: 30px 20px;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    width: 95%;
    max-width: 800px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }
  .header h1 {
    font-size: 2rem;
  }
  .btn-back {
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: 1px solid white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: bold;
    backdrop-filter: blur(5px);
    transition: background 0.3s;
  }
  .btn-back:hover {
    background: rgba(255, 255, 255, 0.4);
  }
  .results-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .result-card {
    background: white;
    color: #333;
    padding: 20px 25px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .result-info h3 {
    font-size: 1.3rem;
    color: #000dff;
    margin-bottom: 6px;
  }
  .result-info p {
    font-size: 0.9rem;
    color: #666;
    margin-top: 4px;
  }
  .score-badge {
    text-align: right;
  }
  .score-percentage {
    font-size: 1.6rem;
    font-weight: bold;
    color: #28a745;
  }
  .score-fraction {
    font-size: 0.9rem;
    color: #555;
  }
  .loading-text {
    text-align: center;
    font-size: 1.2rem;
    opacity: 0.9;
    margin-top: 40px;
  }
  @media (max-width: 600px) {
    .result-card {
      flex-direction: column;
      align-items: flex-start;
      gap: 15px;
    }
    .score-badge {
      text-align: left;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>My Results</h1>
    <button class="btn-back" onclick="goToDashboard()">⬅ Dashboard</button>
  </div>

  <div id="resultsContainer" class="results-list">
    <div class="loading-text">Loading your exam results...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiC22wBDyBitvwXPfgABS4vu0uNMgmZ5c",
  authDomain: "new-science-5fb45.firebaseapp.com",
  projectId: "new-science-5fb45",
  storageBucket: "new-science-5fb45.firebasestorage.app",
  messagingSenderId: "76803175944",
  appId: "1:76803175944:web:565258c4210a1ac85003bd",
  measurementId: "G-9B5QKQF9DY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const stuDoc = await getDoc(doc(db, "students", user.uid));
    if (stuDoc.exists()) {
      const studentData = stuDoc.data();
      loadResults(studentData.attempts || {});
    } else {
      alert("Student profile not found.");
      location.href = "index.html";
    }
  } else {
    location.href = "index.html";
  }
});

async function loadResults(attempts) {
  const container = document.getElementById("resultsContainer");
  container.innerHTML = "";

  const attemptExamIds = Object.keys(attempts);

  if (attemptExamIds.length === 0) {
    container.innerHTML = "<div class='loading-text'>You have not completed any exams yet.</div>";
    return;
  }

  const examsSnap = await getDocs(collection(db, "exams"));
  const examMap = {};
  examsSnap.forEach((docSnap) => {
    examMap[docSnap.id] = docSnap.data();
  });

  attemptExamIds.forEach((examId) => {
    const attempt = attempts[examId];
    const examInfo = examMap[examId] || { title: "Deleted Exam" };

    const card = document.createElement("div");
    card.className = "result-card";

    const formattedDate = attempt.submittedAt 
      ? new Date(attempt.submittedAt).toLocaleDateString() + " " + new Date(attempt.submittedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : "Completed";

    card.innerHTML = `
      <div class="result-info">
        <h3>${examInfo.title}</h3>
        <p>📅 Submitted: ${formattedDate}</p>
      </div>
      <div class="score-badge">
        <div class="score-percentage">${attempt.percentage}%</div>
        <div class="score-fraction">${attempt.score} / ${attempt.totalQuestions} Marks</div>
      </div>
    `;

    container.appendChild(card);
  });
}

window.goToDashboard = () => {
  location.href = "student-dashboard.html";
};
</script>

</body>
</html>
