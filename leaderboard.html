<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leaderboard | Easy Learn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #6b73ff, #000dff);
    min-height: 100vh;
    padding: 30px 20px;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    width: 95%;
    max-width: 850px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 2rem;
  }
  .btn-back {
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: 1px solid white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: bold;
    backdrop-filter: blur(5px);
    transition: background 0.3s;
  }
  .btn-back:hover {
    background: rgba(255, 255, 255, 0.4);
  }
  .controls-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 15px 20px;
    margin-bottom: 25px;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: center;
    justify-content: space-between;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .filter-group label {
    font-weight: bold;
    font-size: 0.95rem;
  }
  .select-input {
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    font-size: 0.95rem;
    outline: none;
    background: #fff;
    color: #333;
    font-weight: bold;
  }
  .leaderboard-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    color: #333;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .leaderboard-table th {
    background: #000dff;
    color: white;
    padding: 15px;
    font-size: 1rem;
    text-align: left;
  }
  .leaderboard-table td {
    padding: 14px 15px;
    border-bottom: 1px solid #eee;
    font-size: 0.95rem;
  }
  .leaderboard-table tr:hover {
    background: #f8f9fa;
  }
  .rank {
    font-weight: bold;
    font-size: 1.1rem;
    width: 60px;
    text-align: center;
  }
  .top-1 { color: #ffd700; font-size: 1.3rem; }
  .top-2 { color: #c0c0c0; font-size: 1.3rem; }
  .top-3 { color: #cd7f32; font-size: 1.3rem; }
  .loading-text {
    text-align: center;
    font-size: 1.2rem;
    opacity: 0.9;
    margin-top: 40px;
  }
  @media (max-width: 600px) {
    .controls-card { flex-direction: column; align-items: stretch; }
    .leaderboard-table th, .leaderboard-table td { padding: 10px 8px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏆 Leaderboard</h1>
    <button class="btn-back" onclick="goToDashboard()">⬅ Dashboard</button>
  </div>

  <div class="controls-card">
    <div class="filter-group">
      <label for="rankingType">View Type:</label>
      <select id="rankingType" class="select-input">
        <option value="overall">Overall Leaderboard</option>
        <option value="examWise">Exam-Wise Leaderboard</option>
      </select>
    </div>

    <div class="filter-group" id="examSelectContainer" style="display: none;">
      <label for="examSelect">Select Exam:</label>
      <select id="examSelect" class="select-input">
        <option value="">Loading exams...</option>
      </select>
    </div>
  </div>

  <div id="leaderboardContent">
    <div class="loading-text">Loading student rankings...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiC22wBDyBitvwXPfgABS4vu0uNMgmZ5c",
  authDomain: "new-science-5fb45.firebaseapp.com",
  projectId: "new-science-5fb45",
  storageBucket: "new-science-5fb45.firebasestorage.app",
  messagingSenderId: "76803175944",
  appId: "1:76803175944:web:565258c4210a1ac85003bd",
  measurementId: "G-9B5QKQF9DY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allStudents = [];
let allExams = [];

onAuthStateChanged(auth, async (user) => {
  if (user) {
    await fetchData();
    setupEventListeners();
    renderLeaderboard();
  } else {
    location.href = "index.html";
  }
});

async function fetchData() {
  // Fetch Students
  const stuSnap = await getDocs(collection(db, "students"));
  allStudents = [];
  stuSnap.forEach(docSnap => {
    allStudents.push({ id: docSnap.id, ...docSnap.data() });
  });

  // Fetch Exams
  const examSnap = await getDocs(collection(db, "exams"));
  allExams = [];
  const examSelect = document.getElementById("examSelect");
  examSelect.innerHTML = "";

  examSnap.forEach(docSnap => {
    const data = docSnap.data();
    allExams.push({ id: docSnap.id, ...data });
    
    const option = document.createElement("option");
    option.value = docSnap.id;
    option.textContent = data.title;
    examSelect.appendChild(option);
  });
}

function setupEventListeners() {
  const rankingType = document.getElementById("rankingType");
  const examSelectContainer = document.getElementById("examSelectContainer");
  const examSelect = document.getElementById("examSelect");

  rankingType.addEventListener("change", (e) => {
    if (e.target.value === "examWise") {
      examSelectContainer.style.display = "flex";
    } else {
      examSelectContainer.style.display = "none";
    }
    renderLeaderboard();
  });

  examSelect.addEventListener("change", () => {
    renderLeaderboard();
  });
}

function renderLeaderboard() {
  const type = document.getElementById("rankingType").value;
  if (type === "overall") {
    renderOverallLeaderboard();
  } else {
    renderExamWiseLeaderboard();
  }
}

function renderOverallLeaderboard() {
  const container = document.getElementById("leaderboardContent");
  const rankings = [];

  allStudents.forEach(student => {
    const attempts = student.attempts || {};
    let totalScore = 0;
    let totalPctSum = 0;
    let attemptedCount = 0;

    Object.values(attempts).forEach(attempt => {
      totalScore += attempt.score || 0;
      totalPctSum += attempt.percentage || 0;
      attemptedCount++;
    });

    const avgPct = attemptedCount > 0 ? Math.round(totalPctSum / attemptedCount) : 0;

    rankings.push({
      name: student.name || "Unknown",
      index: student.index || "N/A",
      totalScore: totalScore,
      avgPct: avgPct,
      examsCount: attemptedCount
    });
  });

  rankings.sort((a, b) => b.totalScore - a.totalScore || b.avgPct - a.avgPct);

  if (rankings.length === 0) {
    container.innerHTML = "<div class='loading-text'>No student rankings recorded yet.</div>";
    return;
  }

  let tableHtml = `
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th style="text-align:center;">Rank</th>
          <th>Student Name</th>
          <th>Index</th>
          <th>Exams Taken</th>
          <th>Avg. Score</th>
          <th>Total Marks</th>
        </tr>
      </thead>
      <tbody>
  `;

  rankings.forEach((student, index) => {
    let rankBadge = `${index + 1}`;
    if (index === 0) rankBadge = `<span class="top-1">🥇</span>`;
    else if (index === 1) rankBadge = `<span class="top-2">🥈</span>`;
    else if (index === 2) rankBadge = `<span class="top-3">🥉</span>`;

    tableHtml += `
      <tr>
        <td class="rank">${rankBadge}</td>
        <td><strong>${student.name}</strong></td>
        <td>${student.index}</td>
        <td>${student.examsCount}</td>
        <td>${student.avgPct}%</td>
        <td><strong>${student.totalScore}</strong></td>
      </tr>
    `;
  });

  tableHtml += `</tbody></table>`;
  container.innerHTML = tableHtml;
}

function renderExamWiseLeaderboard() {
  const container = document.getElementById("leaderboardContent");
  const selectedExamId = document.getElementById("examSelect").value;

  if (!selectedExamId) {
    container.innerHTML = "<div class='loading-text'>No exam selected or no exams available.</div>";
    return;
  }

  const rankings = [];

  allStudents.forEach(student => {
    const attempts = student.attempts || {};
    const attempt = attempts[selectedExamId];

    if (attempt) {
      rankings.push({
        name: student.name || "Unknown",
        index: student.index || "N/A",
        score: attempt.score,
        totalQuestions: attempt.totalQuestions,
        percentage: attempt.percentage,
        submittedAt: attempt.submittedAt
      });
    }
  });

  rankings.sort((a, b) => b.score - a.score || b.percentage - a.percentage);

  if (rankings.length === 0) {
    container.innerHTML = "<div class='loading-text'>No students have completed this exam yet.</div>";
    return;
  }

  let tableHtml = `
    <table class="leaderboard-table">
      <thead>
        <tr>
          <th style="text-align:center;">Rank</th>
          <th>Student Name</th>
          <th>Index</th>
          <th>Score</th>
          <th>Percentage</th>
        </tr>
      </thead>
      <tbody>
  `;

  rankings.forEach((student, index) => {
    let rankBadge = `${index + 1}`;
    if (index === 0) rankBadge = `<span class="top-1">🥇</span>`;
    else if (index === 1) rankBadge = `<span class="top-2">🥈</span>`;
    else if (index === 2) rankBadge = `<span class="top-3">🥉</span>`;

    tableHtml += `
      <tr>
        <td class="rank">${rankBadge}</td>
        <td><strong>${student.name}</strong></td>
        <td>${student.index}</td>
        <td>${student.score} / ${student.totalQuestions}</td>
        <td><strong>${student.percentage}%</strong></td>
      </tr>
    `;
  });

  tableHtml += `</tbody></table>`;
  container.innerHTML = tableHtml;
}

window.goToDashboard = () => {
  location.href = "student-dashboard.html";
};
</script>

</body>
</html>
